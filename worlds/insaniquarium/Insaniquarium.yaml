# Q. What is this file?
# A. This file contains options which allow you to configure your multiworld experience while allowing
#    others to play how they want as well.
#
# Q. How do I use it?
# A. The options in this file are weighted. This means the higher number you assign to a value, the
#    more chances you have for that option to be chosen. For example, an option like this:
#
#    map_shuffle:
#      on: 5
#      off: 15
#
#    Means you have 5 chances for map shuffle to occur, and 15 chances for map shuffle to be turned
#    off.
#
# Q. I've never seen a file like this before. What characters am I allowed to use?
# A. This is a .yaml file. You are allowed to use most characters.
#    To test if your yaml is valid or not, you can use this website:
#        http://www.yamllint.com/
#    You can also verify that your Archipelago options are valid at this site:
#        https://archipelago.gg/check

# Your name in-game, limited to 16 characters.
#     {player} will be replaced with the player's slot number.
#     {PLAYER} will be replaced with the player's slot number, if that slot number is greater than 1.
#     {number} will be replaced with the counter value of the name.
#     {NUMBER} will be replaced with the counter value of the name, if the counter value is greater than 1.
name: Player{number}

# Used to describe your yaml. Useful if you have multiple files.
description: Default Insaniquarium Deluxe Template

game: Insaniquarium Deluxe
requires:
  version: 0.6.7 # Version of Archipelago required for this yaml to work as expected.
  game:
    Insaniquarium Deluxe: 0.2.0 # Version of the world required for this yaml to work as expected.

Insaniquarium Deluxe:
  ################
  # Game Options #
  ################
  progression_balancing:
    # A system that can move progression earlier, to try and prevent the player from getting stuck and bored early.
    # 
    # A lower setting means more getting stuck. A higher setting means less getting stuck.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 99
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-99: 0 # random value between 0 and 99
    disabled: 0 # equivalent to 0
    normal: 50 # equivalent to 50
    extreme: 0 # equivalent to 99

  accessibility:
    # Set rules for reachability of your items/locations.
    # 
    # **Full:** ensure everything can be reached and acquired.
    # 
    # **Minimal:** ensure what is needed to reach your goal can be acquired.
    full: 50
    minimal: 0

  starting_tank:
    # Choose which tank you start with.
    # Randomized: A random tank unlock (Tank 1 through 4) is given as starting inventory.
    # Tank 1 - 4: Begin with the selected tank unlocked.
    randomized: 50
    tank_1: 0
    tank_2: 0
    tank_3: 0
    tank_4: 0

  upgrade_availability:
    # Choose when received upgrade items are available during each level
    # 0: Upgrades are immediately applied once recevied
    # 1: Upgrades are available for free once received
    # 2: Upgrades are available for normal price once received
    always: 0
    free: 50
    normal_price: 0

  starting_pet_slots:
    # Choose how many pet slots to start with.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 24
    0: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-24: 0 # random value between 0 and 24

  pet_slot_items:
    # Choose how many unlockable pet slots are available as items.
    # Combined with the above option, the total number of pet slots in the game will be
    # Starting Pet Slots + Pet Slot Items
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 24
    3: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-24: 0 # random value between 0 and 24

  ######################
  # Victory Conditions #
  ######################
  cyrax_required:
    # Choose if cyrax is necessary to win.
    'false': 0
    'true': 50

  time_trial_required:
    # Choose if time trials are necessary to win.
    'false': 50
    'true': 0

  challenge_mode_required:
    # Choose if challenge mode is necessary to win.
    'false': 50
    'true': 0

  ######################
  # Included Locations #
  ######################
  egg_pieces_per_level:
    # Choose how many egg purchases in each level provide an Archipelago check.
    # 1: Only the final egg piece is a check (20 level checks).
    # 2: Egg pieces 1 and 3 are checks (40 level checks).
    # 3: All 3 egg pieces in every level are checks (60 level checks).
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 1
    # Maximum value is 3
    3: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-1-3: 0 # random value between 1 and 3

  include_time_trials:
    # Include 4 Time Trial completion checks in the randomizer pool.
    # NOTE: This option is overwritten by 'Time Trial Required' if enabled.
    'false': 0
    'true': 50

  include_challenge_mode:
    # Include 4 Challenge Mode completion checks in the randomizer pool.
    # NOTE: This option is overwritten by 'Challenge Mode Required' if enabled.
    'false': 0
    'true': 50

  bonus_pet_locations:
    # Choose how many bonus pets are location checks (0 to 4).
    # 0: Disables bonus pet checks.
    # 1-4: Bonus Pet 1 through the selected number are location checks.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 4
    0: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-4: 0 # random value between 0 and 4

  aliensanity:
    # Choose if defeating aliens for the first time is a check
    'false': 0
    'true': 50

  ###############
  # Bonus Items #
  ###############
  bonus_shells_weight:
    # This is summed with other bonus item weights to determine the probability of receiving bonus money.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 100
    0: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-100: 0 # random value between 0 and 100

  bonus_money_weight:
    # This is summed with other bonus item weights to determine the probability of receiving bonus money.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 1
    # Maximum value is 100
    1: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-1-100: 0 # random value between 1 and 100

  #########
  # Traps #
  #########
  trap_chance:
    # Percentage chance to replace non-progression filler items with traps.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 100
    10: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-100: 0 # random value between 0 and 100

  alien_attack_trap_weight:
    # Relative weight of Alien Attack Traps when a trap is selected.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 100
    50: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-100: 0 # random value between 0 and 100

  famine_trap_weight:
    # Relative weight of Famine Traps when a trap is selected.
    #
    # You can define additional values between the minimum and maximum values.
    # Minimum value is 0
    # Maximum value is 100
    50: 50
    random: 0
    random-low: 0 # random value weighted towards lower values
    random-high: 0 # random value weighted towards higher values
    random-range-0-100: 0 # random value between 0 and 100

  ###########################
  # Item & Location Options #
  ###########################
  local_items:
    # Forces these items to be in their native world.
    []

  non_local_items:
    # Forces these items to be outside their native world.
    []

  start_inventory:
    # Start with the specified amount of these items. Example: "Bomb: 1"
    {}

  start_inventory_from_pool:
    # Start with the specified amount of these items and don't place them in the world. Example: "Bomb: 1"
    # 
    # The game decides what the replacement items will be.
    {}

  start_hints:
    # Start with these item's locations prefilled into the ``!hint`` command.
    []

  start_location_hints:
    # Start with these locations and their item prefilled into the ``!hint`` command.
    []

  exclude_locations:
    # Prevent these locations from having an important item.
    []

  priority_locations:
    # Prevent these locations from having an unimportant item.
    []

  item_links:
    # Share part of your item pool with other players.
    []

  plando_items:
    # Generic items plando.
    []
